name: Lean verification

# Builds the Lean 4 + mathlib formalization under lean/ and rejects any
# non-standard proof escape hatches (sorry/admit/axiom/native_decide).
# Mirrors the supervisor's unrestricted-boolean-mul CI, adapted for this
# monorepo where the Lean project lives in the lean/ subdirectory.

on:
  workflow_dispatch:
  pull_request:
    paths: [lean/**, .github/workflows/lean.yml]
  push:
    branches: [main]
    paths: [lean/**, .github/workflows/lean.yml]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: lean
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          use-github-cache: true
          use-mathlib-cache: false
          # The Lean project lives in lean/, not the repo root, so point the
          # action there. Without this it looks for lean-toolchain at the repo
          # root, finds none, and fails installing elan. (defaults.run.working-
          # directory only affects run: steps, not uses: action steps.)
          lake-package-directory: lean

      - name: Restore Mathlib binary cache
        run: lake exe cache --cache-from=legacy get

      - name: Restore project object cache
        id: project-cache
        uses: actions/cache/restore@v4
        with:
          path: lean/.lake/build
          key: ${{ runner.os }}-lean-project-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lean-project-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-

      - name: Build all Lean modules
        run: lake build

      - name: Reject non-standard proof escape hatches
        run: |
          if rg -n '(^|[^A-Za-z_])(sorry|admit|native_decide)([^A-Za-z_]|$)|^[[:space:]]*axiom[[:space:]]' ThesisLean ThesisLean.lean AxiomAudit.lean; then
            echo "Found a banned proof construct (sorry/admit/native_decide/axiom)."
            exit 1
          fi

      - name: Print headline theorem axioms
        run: lake env lean AxiomAudit.lean

      - name: Replay declarations with leanchecker
        run: lake env leanchecker ThesisLean

      - name: Save project object cache
        if: success() && steps.project-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: lean/.lake/build
          key: ${{ runner.os }}-lean-project-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ github.sha }}

      - name: Replay from source on the weekly schedule
        if: github.event_name == 'schedule'
        run: lake env leanchecker --fresh ThesisLean
