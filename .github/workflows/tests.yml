name: Tests

# Deterministic suites: the fast pytest suite (the slow n<=5 corpus is run
# by scripts/execution_record.sh) and the UI type check, Vitest and build.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - tests/**
      - scripts/**
      - problems/**
      - ui/**
      - pyproject.toml
      - .github/workflows/tests.yml
  push:
    branches: [main]
    paths:
      - src/**
      - tests/**
      - scripts/**
      - problems/**
      - ui/**
      - pyproject.toml
      - .github/workflows/tests.yml

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.14.6
      - run: ruff check --isolated --select F,E,W,N --ignore E501 src scripts tests

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # Ubuntu 24.04 blocks unprivileged user namespaces by default; the
      # candidate jail (sandbox.py) and the agent jail need them.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pip install -e ".[api,ui,dev]"
      - run: pytest -q -m "not slow" -p no:cacheprovider

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npm run build
      # The committed built UI (src/evoalgo/ui_dist, tracked) must equal a
      # fresh build; vite writes there with emptyOutDir, so a diff means the
      # committed artifact is stale.
      - name: Check built UI is reproducible
        run: |
          if [ -n "$(git status --porcelain -- ../src/evoalgo/ui_dist)" ]; then
            echo "Built UI differs from committed src/evoalgo/ui_dist:"
            git status --porcelain -- ../src/evoalgo/ui_dist
            git diff --stat -- ../src/evoalgo/ui_dist
            exit 1
          fi
          echo "Built UI is byte-identical to committed src/evoalgo/ui_dist"
