# Evaluation campaign 1: three modes x three problems x three seeds, one model.
# Run:    .venv/bin/python scripts/campaign.py run campaign/eval1.yaml --parallel 4
# Report: .venv/bin/python scripts/campaign.py report campaign/eval1.yaml
name: eval1
out: campaign/eval1
scratch: /proj/MPS/MPS_DEV_REPO/ethomdt/evoalgo-scratch   # TMPDIR for all child processes
goal: Reach full correctness first, then avoid a full recompute after updates.
modes: [orchestrator, no_reflection, harness]
problems: [dynamic_bfs, dynamic_dfs, dynamic_lbfs]
seeds: [1, 2, 3]

# Same settings as the calibration runs (runs/calib_*_qwen27b).
orchestrator:
  provider: api
  api_base_url: ericai
  model: Qwen/Qwen3.8-27B-FP8
  population_size: 4
  max_generations: 8
  elitism_k: 1
  model_call_budget: 64
  early_stop_on_success: false
  agent_max_steps: 16
  agent_max_seconds: 900

harness:
  bin: /home/ethomdt/.enlcode/enlcode
  model: ericai/Qwen/Qwen3.8-27B-FP8
  agent: evoalgo-researcher   # agents/evoalgo-researcher.json, copied to ~/.enlcode/agents
  max_checks: 8
  max_attempts: 2

timeouts:
  orchestrator_seconds: 7200
  harness_seconds: 5400
