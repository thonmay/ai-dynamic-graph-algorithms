# Evaluation campaign 2: dynamic agent generation ablation and a second model.
# Run:    .venv/bin/python scripts/campaign.py run campaign/eval2.yaml --parallel 4
# Report: .venv/bin/python scripts/campaign.py report campaign/eval2.yaml
#
# Part A (this file): orchestrator with vs without dynamic agents on LBFS,
# where eval1's search stalled on cost (best work ratio flat from gen 2-4 on).
# The "orchestrator" cells reuse eval1's settings (same seeds), so eval1's
# orchestrator_dynamic_lbfs runs are directly comparable as well.
name: eval2
out: campaign/eval2
scratch: /proj/MPS/MPS_DEV_REPO/ethomdt/evoalgo-scratch
goal: Reach full correctness first, then avoid a full recompute after updates.
modes: [dynamic_agents, orchestrator]
problems: [dynamic_lbfs]
seeds: [1, 2, 3]

# Same as eval1 (Qwen3.8-27B, population 4, 8 generations, 64 calls).
orchestrator:
  provider: api
  api_base_url: ericai
  model: Qwen/Qwen3.8-27B-FP8
  population_size: 4
  max_generations: 8
  elitism_k: 1
  model_call_budget: 64
  early_stop_on_success: false
  agent_max_steps: 16
  agent_max_seconds: 900

# eval1 LBFS runs stalled from generation 2-4 on, so a 2-generation window
# fires within the 8-generation budget. Same total call budget as the
# orchestrator cells: a specialist's calls count against the 64.
dynamic_agents:
  plateau_window: 2
  plateau_epsilon: 0.01
  agent_budget: 1
  specialist_generations: 3

harness:
  bin: /home/ethomdt/.enlcode/enlcode
  model: ericai/Qwen/Qwen3.8-27B-FP8
  agent: evoalgo-researcher
  max_checks: 8
  max_attempts: 2

timeouts:
  orchestrator_seconds: 7200
  harness_seconds: 5400
