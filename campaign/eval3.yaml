# Evaluation campaign 3: second model (Gemma-4-31B-it on EricAI), one seed,
# all three modes on BFS/DFS/LBFS, otherwise as eval1.
# Run:    .venv/bin/python scripts/campaign.py run campaign/eval3.yaml --parallel 4
name: eval3
out: campaign/eval3
scratch: /proj/MPS/MPS_DEV_REPO/ethomdt/evoalgo-scratch
goal: Reach full correctness first, then avoid a full recompute after updates.
modes: [orchestrator, no_reflection, harness]
problems: [dynamic_bfs, dynamic_dfs, dynamic_lbfs]
seeds: [1]

orchestrator:
  provider: api
  api_base_url: ericai
  model: Google/Gemma-4-31B-it
  population_size: 4
  max_generations: 8
  elitism_k: 1
  model_call_budget: 64
  early_stop_on_success: false
  agent_max_steps: 16
  agent_max_seconds: 900

harness:
  bin: /home/ethomdt/.enlcode/enlcode
  model: ericai/Google/Gemma-4-31B-it
  agent: evoalgo-researcher
  max_checks: 8
  max_attempts: 2

timeouts:
  orchestrator_seconds: 7200
  harness_seconds: 5400
