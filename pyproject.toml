[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evoalgo"
version = "0.1.0"
description = "Evolutionary code-repair system for dynamic graph algorithm discovery"
requires-python = ">=3.11"
authors = [{name = "Thonmay Md Thoriqul Islam"}]
dependencies = [
    "numpy==2.4.6",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Built-in agent loop over OpenAI-compatible endpoints (provider: api)
api = [
    "openai==3.35.1",
    "httpx==0.28.1",
]
# Web UI server (evoalgo ui)
ui = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "websockets==15.0.1",
]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[project.scripts]
evoalgo = "evoalgo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running verifier self-test (full n<=5 universe per candidate)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Built web UI (cd ui && npm run build), served by `evoalgo ui`
evoalgo = ["ui_dist/*.html", "ui_dist/assets/*", "agents/prompts/*.md",
           "skill/evoalgo/*.md", "skill/evoalgo/references/*.md"]
